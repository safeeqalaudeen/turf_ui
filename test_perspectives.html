<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin: 0;
  background: #00130d;
  padding: 40px;
  display: flex;
  gap: 40px;
  flex-wrap: wrap;
}
.wrapper {
  perspective: 1200px;
  width: 480px;
}
.card {
  width: 460px;
  aspect-ratio: 16/10;
  border-radius: 24px;
  background: #00251a;
  border: 2px solid #00f5b0;
  box-shadow: 0 0 35px rgba(0, 245, 176, 0.45);
  position: relative;
  overflow: hidden;
}
.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Option A: Pure 2D rotation */
.card-a {
  transform: rotate(-3.5deg);
  box-shadow: 
    0 0 35px rgba(0, 245, 176, 0.45),
    12px 6px 0px rgba(0, 37, 26, 0.95),
    13px 7px 0px 1px rgba(0, 245, 176, 0.4),
    20px 15px 40px rgba(0, 0, 0, 0.8);
}

/* Option B: 3D perspective with rotateY, rotateX, rotate */
.card-b {
  transform: perspective(1000px) rotateY(-14deg) rotateX(6deg) rotate(-3deg);
  transform-style: preserve-3d;
  box-shadow: 
    0 0 35px rgba(0, 245, 176, 0.45),
    14px 6px 0px rgba(0, 37, 26, 0.95),
    15px 7px 0px 1px rgba(0, 245, 176, 0.35),
    25px 20px 45px rgba(0, 0, 0, 0.85);
}

/* Option C: 3D perspective with stronger rotate */
.card-c {
  transform: perspective(1100px) rotateY(-12deg) rotateX(4deg) rotate(-4deg);
  transform-style: preserve-3d;
  box-shadow: 
    0 0 35px rgba(0, 245, 176, 0.45),
    12px 5px 0px #001f16,
    13px 6px 0px 1px rgba(0, 245, 176, 0.35),
    20px 15px 40px rgba(0, 0, 0, 0.8);
}

/* Option D: Exact reference angle */
.card-d {
  transform: perspective(900px) rotateY(-16deg) rotateX(6deg) rotate(-2.5deg);
  box-shadow: 
    0 0 30px rgba(0, 245, 176, 0.45),
    14px 6px 0px #001e15,
    15px 7px 0px 1px rgba(0, 245, 176, 0.4),
    22px 18px 45px rgba(0, 0, 0, 0.85);
}
</style>
</head>
<body>
  <div class='wrapper'><div class='card card-a'><img src='src/assets/turf_pitch_clean.jpg'></div></div>
  <div class='wrapper'><div class='card card-b'><img src='src/assets/turf_pitch_clean.jpg'></div></div>
  <div class='wrapper'><div class='card card-c'><img src='src/assets/turf_pitch_clean.jpg'></div></div>
  <div class='wrapper'><div class='card card-d'><img src='src/assets/turf_pitch_clean.jpg'></div></div>
</body>
</html>
