<!DOCTYPE html>
<html>
<head>
<script src='https://cdn.tailwindcss.com'></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,800;1,900&display=swap');
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: #00130d;
  margin: 0;
  padding: 40px;
}
.perspective-container {
  perspective: 1200px;
}
.tilted-card-tune1 {
  transform: perspective(1000px) rotateY(-13deg) rotateX(5deg) rotate(-2.8deg);
  transform-style: preserve-3d;
  box-shadow: 
    0 0 35px rgba(0, 245, 176, 0.45),
    0 0 15px rgba(200, 255, 0, 0.2),
    13px 6px 0px 0px #002217,
    14px 7px 0px 1px rgba(0, 245, 176, 0.4),
    24px 18px 45px rgba(0, 0, 0, 0.85);
}
.tilted-card-tune2 {
  transform: perspective(1100px) rotateY(-15deg) rotateX(6deg) rotate(-3.2deg);
  transform-style: preserve-3d;
  box-shadow: 
    0 0 35px rgba(0, 245, 176, 0.45),
    0 0 15px rgba(200, 255, 0, 0.2),
    14px 6px 0px 0px #002217,
    15px 7px 0px 1px rgba(0, 245, 176, 0.4),
    26px 20px 45px rgba(0, 0, 0, 0.85);
}
</style>
</head>
<body class='flex gap-12 items-start justify-center'>
  
  <!-- Tune 1 -->
  <div class='perspective-container w-[490px]'>
    <div class='relative w-full rounded-[24px] overflow-hidden border-2 border-[#00F5B0]/80 bg-[#00251A] tilted-card-tune1 select-none'>
      <div class='relative aspect-[16/10] overflow-hidden'>
        <img src='src/assets/turf_pitch_clean.jpg' class='w-full h-full object-cover'>
        <div class='absolute inset-0 bg-gradient-to-t from-[#00130D] via-transparent to-black/35 pointer-events-none'></div>
        
        <!-- Live Availability -->
        <div class='absolute top-3.5 left-3.5 z-10 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#00130D]/85 border border-[#00F5B0]/40 backdrop-blur-md'>
          <span class='w-2 h-2 rounded-full bg-[#00F5B0]'></span>
          <span class='text-[10px] font-bold text-[#00F5B0] tracking-wider'>Live Availability</span>
        </div>
        
        <!-- Heart button -->
        <div class='absolute top-3.5 right-3.5 z-10 w-8 h-8 rounded-full bg-black/60 backdrop-blur-md border border-white/20 flex items-center justify-center text-white'>
          <svg class='w-3.5 h-3.5' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z'/></svg>
        </div>
        
        <!-- Left & Right arrows -->
        <div class='absolute left-3 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-black/60 border border-white/20 flex items-center justify-center text-white text-xs'>&lt;</div>
        <div class='absolute right-3 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-black/60 border border-white/20 flex items-center justify-center text-white text-xs'>&gt;</div>
        
        <!-- Bottom Info -->
        <div class='absolute bottom-3 left-3.5 right-3.5 z-10 flex items-end justify-between gap-2'>
          <div>
            <div class='text-[10px] font-bold tracking-wider text-[#00F5B0] uppercase italic'>FIFA Quality Pro Pitch</div>
            <h3 class='text-sm sm:text-base font-bold text-white tracking-tight'>Instant Hourly Slot Booking</h3>
          </div>
          <div class='inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-black/80 border border-[#FFC400]/40 shrink-0'>
            <span class='text-[#FFC400] text-xs'>★</span>
            <span class='text-xs font-bold text-[#FFC400]'>4.9 (1.2K+ Bookings)</span>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Dots -->
    <div class='mt-4 flex items-center justify-center gap-1.5'>
      <span class='h-1.5 w-7 rounded-full bg-[#00F5B0] shadow-[0_0_8px_#00F5B0]'></span>
      <span class='h-1.5 w-1.5 rounded-full bg-[#2A473C]'></span>
      <span class='h-1.5 w-1.5 rounded-full bg-[#2A473C]'></span>
    </div>
  </div>

  <!-- Tune 2 -->
  <div class='perspective-container w-[490px]'>
    <div class='relative w-full rounded-[24px] overflow-hidden border-2 border-[#00F5B0]/80 bg-[#00251A] tilted-card-tune2 select-none'>
      <div class='relative aspect-[16/10] overflow-hidden'>
        <img src='src/assets/turf_pitch_clean.jpg' class='w-full h-full object-cover'>
        <div class='absolute inset-0 bg-gradient-to-t from-[#00130D] via-transparent to-black/35 pointer-events-none'></div>
        
        <!-- Live Availability -->
        <div class='absolute top-3.5 left-3.5 z-10 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#00130D]/85 border border-[#00F5B0]/40 backdrop-blur-md'>
          <span class='w-2 h-2 rounded-full bg-[#00F5B0]'></span>
          <span class='text-[10px] font-bold text-[#00F5B0] tracking-wider'>Live Availability</span>
        </div>
        
        <!-- Heart button -->
        <div class='absolute top-3.5 right-3.5 z-10 w-8 h-8 rounded-full bg-black/60 backdrop-blur-md border border-white/20 flex items-center justify-center text-white'>
          <svg class='w-3.5 h-3.5' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z'/></svg>
        </div>
        
        <!-- Left & Right arrows -->
        <div class='absolute left-3 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-black/60 border border-white/20 flex items-center justify-center text-white text-xs'>&lt;</div>
        <div class='absolute right-3 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-black/60 border border-white/20 flex items-center justify-center text-white text-xs'>&gt;</div>
        
        <!-- Bottom Info -->
        <div class='absolute bottom-3 left-3.5 right-3.5 z-10 flex items-end justify-between gap-2'>
          <div>
            <div class='text-[10px] font-bold tracking-wider text-[#00F5B0] uppercase italic'>FIFA Quality Pro Pitch</div>
            <h3 class='text-sm sm:text-base font-bold text-white tracking-tight'>Instant Hourly Slot Booking</h3>
          </div>
          <div class='inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-black/80 border border-[#FFC400]/40 shrink-0'>
            <span class='text-[#FFC400] text-xs'>★</span>
            <span class='text-xs font-bold text-[#FFC400]'>4.9 (1.2K+ Bookings)</span>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Dots -->
    <div class='mt-4 flex items-center justify-center gap-1.5'>
      <span class='h-1.5 w-7 rounded-full bg-[#00F5B0] shadow-[0_0_8px_#00F5B0]'></span>
      <span class='h-1.5 w-1.5 rounded-full bg-[#2A473C]'></span>
      <span class='h-1.5 w-1.5 rounded-full bg-[#2A473C]'></span>
    </div>
  </div>

</body>
</html>
